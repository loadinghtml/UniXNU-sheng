name: package

# scripts/package.sh of this repository on a macOS runner, with the UniXNU and uefi-sheng
# checkouts beside it, the layout board.toml names. The platform seed comes from the
# repository secret UNIXNU_UNIQUE_CHIP_ID and is baked into the images, so the run's
# artifacts belong to one device alone: download them, then delete the run.

on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS profile of the images"
        type: choice
        options: ["27", "26", "17"]
        default: "27"
      init_data:
        description: "Create a NEW installation seed if no saved seed exists (iPadOS 27 only)"
        type: boolean
        default: false
      data_seed_url:
        description: "Optional original data.dbr URL for an existing installation; otherwise use the saved cache"
        type: string
      data_seed_sha256:
        description: "Required SHA-256 when data_seed_url is supplied"
        type: string

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: 82b847c4ac3f68a57024b3082ffa3a03442defd9 # Wi-Fi runtime and Data firmware integration
          path: UniXNU
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/uefi-sheng
          path: uefi-sheng
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU-sm8550-common
          ref: 2dc650ca76ae38715cd0712e60a44b14fe251745
          path: UniXNU-sm8550-common
      - name: Fetch and verify device firmware
        working-directory: device
        run: |
          python3 scripts/extract-files.py
          python3 scripts/extract-files.py --check
          python3 drivers/QcomIris/tools/fetch-sources.py
          python3 drivers/QcomIris/tools/fetch-sources.py --offline
      - name: Fetch verified Wi-Fi firmware
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import urllib.request
          directory = Path('device/firmware/wcn7850')
          files = json.loads((directory / 'manifest.json').read_text())['files']
          base = 'https://raw.githubusercontent.com/ianchb/sheng-firmware/ebdd6f89ee5aaa132f03860c211bdfb4294bd954/ath12k/WCN7850/hw2.0/'
          for name, expected in files.items():
              if name not in ('amss.bin', 'm3.bin', 'board-2.bin'):
                  raise SystemExit('Unexpected Wi-Fi firmware name: ' + name)
              path = directory / name
              if path.exists():
                  data = path.read_bytes()
              else:
                  with urllib.request.urlopen(base + name, timeout=60) as response:
                      data = response.read(expected['bytes'] + 1)
              if len(data) != expected['bytes'] or hashlib.sha256(data).hexdigest() != expected['sha256']:
                  raise SystemExit('Wi-Fi firmware identity mismatch: ' + name)
              if not path.exists():
                  path.write_bytes(data)
              print('Verified Wi-Fi firmware: ' + name)
          PY
      - name: Apply upstream reference kernel fix
        working-directory: UniXNU
        run: |
          # UniXNU/UniXNU commit 1c9261527e7e90f0eb0f263afeda80598fdd5cd0.
          git apply --check ../device/.github/patches/reference-cache-input-hook.patch
          git apply ../device/.github/patches/reference-cache-input-hook.patch
          python3 scripts/test-fileset-reference.py
      - name: Repair pinned Mesa patch metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('UniXNU/patches/mesa/turnip-frame-diagnostics.patch')
          text = path.read_text()
          header = 'diff --git a/src/freedreno/vulkan/tu_frame_diagnostic.h b/src/freedreno/vulkan/tu_frame_diagnostic.h\n'
          old = header + '--- /dev/null\n'
          new = header + 'new file mode 100644\n--- /dev/null\n'
          if text.count(old) == 1:
              path.write_text(text.replace(old, new, 1))
          elif text.count(new) != 1:
              raise SystemExit('Unexpected Mesa patch header; inspect the pinned source')
          PY
      - name: tools
        run: |
          brew install dtc llvm lld cmake mtools ninja glslang shaderc spirv-tools bison pkgconf rustup blacktop/tap/ipsw
          {
            echo "$HOME/.cargo/bin"
            echo "/opt/homebrew/opt/llvm/bin"
            echo "/opt/homebrew/opt/lld/bin"
            echo "/opt/homebrew/opt/bison/bin"
          } >> "$GITHUB_PATH"
          rustup toolchain install 1.98.0 --profile minimal --component rust-src
          # Fail fast, naming the tool, before forty minutes of build.
          ok=1
          for t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool \
                   mformat mcopy ipsw; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          for t in lld-link llvm-lib llvm-rc llvm-nm llvm-objcopy; do
            [ -f "/opt/homebrew/opt/llvm/bin/$t" ] || [ -f "/opt/homebrew/opt/lld/bin/$t" ] || { echo "missing tool: $t"; ok=0; }
          done
          [ "$ok" = 1 ]
      - name: Check SM8550 Bluetooth and video integration
        working-directory: device
        run: |
          python3 scripts/check-bluetooth-platform.py
          python3 scripts/check-video-platform.py
      - name: Prepare and build Wi-Fi supplicant
        working-directory: device/drivers/Ath12kWifi
        env:
          OS_PROFILE: ${{ inputs.os }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          lock = json.loads(Path('tools/source-lock.json').read_text())
          for name in ('linux', 'freebsd'):
              source = lock[name]
              directory = Path('deps') / name
              if not directory.exists():
                  directory.mkdir(parents=True)
                  subprocess.run(['git', 'init', '-q', str(directory)], check=True)
                  subprocess.run(['git', '-C', str(directory), 'fetch', '--depth=1',
                                  source['url'], source['commit']], check=True)
                  subprocess.run(['git', '-C', str(directory), 'sparse-checkout', 'set',
                                  '--no-cone', *source['paths']], check=True)
                  subprocess.run(['git', '-C', str(directory), 'checkout', '--detach',
                                  source['commit']], check=True)
          PY
          python3 tools/fetch-sources.py
          python3 tools/fetch-sources.py --check
          if [ "$OS_PROFILE" = 27 ]; then
            python3 tools/build-supplicant.py --target ios
          fi
      - name: platform seed
        env:
          seed: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          if ! [[ "$seed" =~ ^[0-9a-fA-F]{8}$ ]]; then
            echo 'Set the repository secret UNIXNU_UNIQUE_CHIP_ID: the platform seed of the device, 8 hex digits.' >&2
            exit 1
          fi
      - name: seed cache identity
        id: seed-key
        env:
          SEED: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          python3 - <<'PY'
          import hashlib, os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('key=data-seed-v1-' + hashlib.sha256(os.environ['SEED'].encode()).hexdigest()[:16] + '\n')
          PY
      - uses: actions/cache/restore@v4
        id: data-cache
        if: inputs.os == '27'
        with:
          path: |
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/inputs.json
          key: ${{ steps.seed-key.outputs.key }}-${{ inputs.os }}
      - name: prepare preserved Data seed
        if: inputs.os == '27'
        env:
          INIT_DATA: ${{ inputs.init_data }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.request
          inputs = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())['inputs']
          path = pathlib.Path('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr')
          url, digest = inputs.get('data_seed_url', ''), inputs.get('data_seed_sha256', '').lower()
          if url:
              print('::add-mask::' + url)
              if not url.startswith('https://') or len(digest) != 64 or any(c not in '0123456789abcdef' for c in digest):
                  raise SystemExit('A seed URL requires HTTPS and its SHA-256')
              with urllib.request.urlopen(url, timeout=120) as source:
                  data = source.read(64 * 1024 * 1024 + 1)
              if len(data) > 64 * 1024 * 1024 or hashlib.sha256(data).hexdigest() != digest:
                  raise SystemExit('Seed size or SHA-256 mismatch')
              if path.exists() and path.read_bytes() != data:
                  raise SystemExit('Saved seed differs; preserve and inspect it instead of replacing this installation')
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          if not path.is_file() and os.environ['INIT_DATA'] != 'true':
              raise SystemExit('No saved seed. Supply the ORIGINAL seed for an existing installation, or select init_data for a FIRST installation')
          PY
      - name: package
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          INIT_DATA: ${{ inputs.init_data }}
          OS_PROFILE: ${{ inputs.os }}
        run: |
          args=(--os "$OS_PROFILE" --uefi ../uefi-sheng
                --local-module "soc:sm8550=$GITHUB_WORKSPACE/UniXNU-sm8550-common")
          if [ "$OS_PROFILE" = 27 ] && [ "$INIT_DATA" = true ]; then
            args+=(--init-data)
          fi
          scripts/package.sh "${args[@]}"
      - name: Show build failure details
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          patterns = ('UniXNU/out/sheng/*/*/logs/*.log',
                      'UniXNU/out/sheng/*/*/tree/build/xnu/fileset-reference/*/*-build.log',
                      'device/drivers/Ath12kWifi/out/wpa-*/build.log')
          for pattern in patterns:
              for path in sorted(Path('.').glob(pattern)):
                  print('::group::' + str(path))
                  print('\n'.join(path.read_text(errors='replace').splitlines()[-160:]))
                  print('::endgroup::')
          PY
      - name: Preserve reference kernel failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reference-kernel-logs-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            UniXNU/out/sheng/*/*/tree/build/xnu/fileset-reference/*/*-build.log
      - uses: actions/cache/save@v4
        if: always() && inputs.os == '27' && steps.data-cache.outputs.cache-hit != 'true' && hashFiles('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr') != ''
        with:
          path: |
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/inputs.json
          key: ${{ steps.seed-key.outputs.key }}-${{ inputs.os }}
      - name: installation seed backup
        if: always() && inputs.os == '27' && hashFiles('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr') != ''
        uses: actions/upload-artifact@v4
        with:
          name: installation-seed-${{ inputs.os }}
          retention-days: 1
          path: |
            UniXNU/out/sheng/*/*/runtime/data.dbr
            UniXNU/out/sheng/*/*/runtime/inputs.json
      - name: images
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ inputs.os }}
          retention-days: 1
          if-no-files-found: error
          path: |
            UniXNU/out/sheng/*/*/boot/boot.img
            UniXNU/out/sheng/*/*/payload/payload.img
            UniXNU/out/sheng/*/*/kernel/kernel.macho
            UniXNU/out/sheng/*/*/package.manifest.json
